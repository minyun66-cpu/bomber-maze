<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>爆爆迷宮</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
:root{--bg:#fff0b8;--ink:#3b2a1a;--muted:#6e5a42;--card:#fffbe8;--line:#3b2a1a;--accent:#f76707;--boss:#c2255c;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2218;--ink:#f7ecd4;--muted:#c9b697;--card:#3b2e21;--line:#e6cf9c;--accent:#ff922b;--boss:#ff8fab}}
:root[data-theme="dark"]{--bg:#2b2218;--ink:#f7ecd4;--muted:#c9b697;--card:#3b2e21;--line:#e6cf9c;--accent:#ff922b;--boss:#ff8fab}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:20px 14px 40px}
h1{margin:0 0 12px;font-size:1.5rem}
.hud{display:grid;grid-template-columns:.8fr .8fr .8fr 2fr;gap:8px;margin-bottom:8px}
.hud div,.boss{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.hud small{display:block;color:var(--muted);font-size:.75rem}
.hud b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.boss{margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-color:var(--boss)}
.boss b{color:var(--boss)}
.boss span{color:var(--muted);font-size:.85rem}
.stage{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:#0f172a}
canvas{display:block;width:100%;height:auto;touch-action:none}
.msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(10,14,25,.82);color:#fff;text-align:center;padding:16px}
.msg.show{display:flex}
.msg h2{margin:0;font-size:2rem}
.msg p{margin:0;color:#cbd3e6;max-width:30em;line-height:1.6}
button{font:inherit;cursor:pointer}
.go{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 22px;font-weight:700}
.help{margin:12px 0 0;color:var(--muted);font-size:.9rem;line-height:1.7}
.pad{display:none;margin-top:12px;grid-template-columns:repeat(4,1fr) 1.6fr;gap:8px}
.pad button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 0;font-size:1.2rem;color:var(--ink);touch-action:manipulation}
.pad .bomb{background:var(--accent);color:#fff;border:0;font-weight:700;font-size:1rem}
@media (pointer:coarse){.pad{display:grid}}

body{background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.35) 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.3) 0 2px,transparent 3px);background-size:90px 90px,130px 130px}
h1{font-size:1.9rem;letter-spacing:.06em;transform:rotate(-1.5deg);display:inline-block;color:var(--accent);text-shadow:2px 2px 0 var(--ink)}
.hud div,.boss{border:3px solid var(--line);border-radius:14px;box-shadow:3px 3px 0 var(--line)}
.hud div:nth-child(odd){transform:rotate(-.6deg)}.hud div:nth-child(even){transform:rotate(.6deg)}
.boss{border-color:var(--boss);box-shadow:3px 3px 0 var(--boss)}
.stage{border:4px solid var(--line);border-radius:18px;box-shadow:5px 5px 0 var(--line);background:#fff1b8}
.msg{background:rgba(255,243,196,.95);color:#3b2a1a}.msg p{color:#5a4630}
.msg h2{font-size:2.2rem;color:#e8590c;text-shadow:2px 2px 0 #3b2a1a;transform:rotate(-2deg)}
.go{border:3px solid #3b2a1a;box-shadow:3px 3px 0 #3b2a1a;border-radius:14px}
.pad button{border:3px solid var(--line);box-shadow:2px 2px 0 var(--line)}
#menu{overflow:auto;justify-content:flex-start;padding-top:18px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%;max-width:460px}
.mgrid button{background:#fffbe8;color:#3b2a1a;border:2px solid #3b2a1a;border-radius:8px;padding:6px 0;font-weight:700}
.mgrid .mid{background:#ffb347}.mgrid .fin{background:#c77dff;color:#fff}
.opt{background:#fffbe8;color:#3b2a1a;border:3px solid #3b2a1a;border-radius:14px;padding:10px 20px;font-weight:700;box-shadow:3px 3px 0 #3b2a1a;min-width:220px}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.msg label{color:#3b2a1a}
.tip{height:6.6em;overflow-y:auto;margin-bottom:8px;padding:6px 12px;border:3px dashed var(--accent);border-radius:12px;background:var(--card);font-size:.85rem;line-height:1.5}

.mgrid .ok{border-color:#2f9e44;box-shadow:inset 0 0 0 2px #8ce99a}.mgrid button[disabled]{opacity:.45}
.msg{z-index:6}.pad{display:none!important}
.ctl,.mbtn{display:none}
.joy{position:relative;width:132px;height:132px;border-radius:50%;background:rgba(255,251,232,.6);border:3px solid rgba(59,42,26,.75);touch-action:none;flex:none}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:#f76707;border:3px solid #3b2a1a;pointer-events:none}
.bombBtn{width:100px;height:100px;border-radius:50%;background:#f76707;border:3px solid #3b2a1a;color:#fff;font-weight:700;font-size:1.05rem;touch-action:none;flex:none;box-shadow:3px 3px 0 #3b2a1a}
.mbtn{position:absolute;top:6px;right:6px;z-index:4;width:34px;height:34px;border-radius:50%;border:3px solid #3b2a1a;background:#fffbe8;color:#3b2a1a;font-size:1rem;padding:0}
html.mob{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html.mob,html.mob body{position:fixed;width:100%;height:100%;overflow:hidden;margin:0;overscroll-behavior:none;touch-action:manipulation}
html.mob .wrap{max-width:none;margin:0;padding:calc(6px + env(safe-area-inset-top)) 6px calc(6px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px;overflow:hidden}
html.mob h1,html.mob .help,html.mob #tomenu{display:none}
html.mob .mbtn{display:block}
html.mob .hud{grid-template-columns:.8fr .9fr .75fr 1.7fr;gap:4px;margin:0}
html.mob .hud div{padding:2px 6px;border-width:2px;box-shadow:2px 2px 0 var(--line);transform:none}
html.mob .hud small{font-size:.6rem}html.mob .hud b{font-size:.78rem;line-height:1.2}
html.mob .tip{height:3.4em;font-size:.68rem;margin:0;padding:2px 8px;border-width:2px}
html.mob .boss{margin:0;padding:2px 8px;font-size:.72rem;border-width:2px;box-shadow:none}
html.mob .stage{flex:none;align-self:center;border-width:3px;box-shadow:none}
html.mob canvas{width:100%;height:100%}
html.mob .ctl{display:flex;flex:1;min-height:0;justify-content:space-between;align-items:center;padding:0 14px}
html.mob.land .tip,html.mob.land .boss{display:none}
html.mob.land .ctl{position:fixed;left:0;right:0;bottom:0;padding:0 18px 14px;align-items:flex-end;pointer-events:none;z-index:5}
html.mob.land .joy,html.mob.land .bombBtn{pointer-events:auto}
html.mob .msg h2{font-size:1.3rem}html.mob .msg p{font-size:.78rem}html.mob .opt{min-width:150px;padding:6px 12px}
html.mob .mgrid button{padding:4px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>爆爆迷宮</h1> <button class="go" id="tomenu" type="button" style="float:right;padding:5px 14px;font-size:.9rem">選單</button>
  <div class="hud">
    <div><small>分數</small><b id="hs">0</b></div>
    <div><small>關卡</small><b id="hl">1/3</b></div>
    <div><small>生命</small><b id="he"></b></div>
    <div><small>你的能力</small><b id="hb"></b></div>
  </div>
  <div class="tip" id="tip"></div>
  <div class="boss"><b id="bn"></b><b id="bh"></b><span id="bs"></span></div>
  <div class="stage">
    <canvas id="c" width="600" height="520" aria-label="遊戲畫面"></canvas>
    <div class="msg" id="msg">
      <h2 id="mt">爆爆迷宮</h2>
      <p id="mp"></p>
      <button class="go" id="mb" type="button">開始遊戲</button>
    </div>
    <div class="msg show" id="menu"></div>
    <button class="mbtn" id="tomenu2" type="button" aria-label="選單">☰</button>
  </div>
  <div class="ctl" id="ctl"><div class="joy" id="joy"><div class="knob" id="knob"></div></div><button class="bombBtn" id="bombBtn" type="button">放炸彈</button></div>
  <div class="pad" id="pad">
    <button data-k="ArrowLeft" type="button" aria-label="左">◀</button>
    <button data-k="ArrowUp" type="button" aria-label="上">▲</button>
    <button data-k="ArrowDown" type="button" aria-label="下">▼</button>
    <button data-k="ArrowRight" type="button" aria-label="右">▶</button>
    <button class="bomb" data-k=" " type="button">放炸彈</button>
  </div>
  <p class="help">方向鍵移動，空白鍵放炸彈。每一關都要<b>打倒魔王</b>才算過關。磚塊會掉道具：<b>小炸彈</b>炸彈數 +1、<b>火焰</b>火力 +1、<b>溜冰鞋</b>移動加速、<b>盾牌</b>護盾（擋一次傷害）。魔王也會搶道具，記得先下手。你有 3 點生命，磚塊可能掉出<b>醫療箱</b>（回 1 點，上限 3 點，掉落機率低）。炸魔王需要多次命中，命中後它有短暫無敵時間。</p>
</div>

<script>
(function(){
  var W=15,H=13,T=40,MAXLV=3;
  var LV=[
    {n:'影子炸彈客',hp:6,en:0,b:1,r:2,s:0,d:'長得和你一樣，會放炸彈、躲爆風，還會搶走地圖上的道具變強。碰到它不會受傷。'},
    {n:'閃現魔導師',hp:6,en:0,b:2,r:3,s:1,d:'同時放兩顆炸彈，每 7 秒閃現到你附近。'},
    {n:'暗黑機甲王',hp:6,en:0,b:2,r:3,s:2,d:'每 6 秒降下炸彈雨，炸彈多、火力大。'}];
  var DIRS=[[0,-1],[1,0],[0,1],[-1,0]],ORD=['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'];
  var cv=document.getElementById('c'),ctx=cv.getContext('2d');
  var $=function(i){return document.getElementById(i)};
  var grid,bombs,flames,enemies,items,player,boss,score=0,level=1,state='menu',keys={},last=0;
  var carry={score:0,b:1,r:2,s:0};
  function rnd(n){return Math.floor(Math.random()*n)}
  function K(x,y){return x+','+y}
  function glide(o,b){
    var dx=o.x-o.vx,dy=o.y-o.vy,ax=Math.abs(dx),ay=Math.abs(dy);
    if(ax<=b){o.vx=o.x;b-=ax;}else{o.vx+=Math.sign(dx)*b;b=0;}
    if(ay<=b){o.vy=o.y;b-=ay;}else{o.vy+=Math.sign(dy)*b;b=0;}
    return b;
  }

  function init(){
    var L=LV[level-1];
    score=carry.score;
    if(!gen(LAYS[pickLay()]))gen(LAYS[0]);
    bombs=[];flames=[];items=[];enemies=[];
    player={x:1,y:1,vx:1,vy:1,dir:0,hp:3,cd:0,maxB:carry.b,range:carry.r,sp:carry.s,sh:0,inv:1};
    boss={x:W-2,y:H-2,vx:W-2,vy:H-2,hp:L.hp,max:L.hp,maxB:L.b,range:L.r,sp:L.s,sh:0,inv:1,cd:1,bcd:2,tp:7,sum:9,rain:6,fx:0};
    hz=[];pj=[];ts=[];beast=null;TH=mode==='ninja'?THEMES[Math.ceil(level/5)-1]:THD;timeLeft=0;if(mode==='ninja')setupNinja(L);
    var tries=0;
    while(enemies.length<L.en&&tries<800){tries++;
      var ex=1+rnd(W-2),ey=1+rnd(H-2);
      if(grid[ey][ex]===0&&Math.abs(ex-1)+Math.abs(ey-1)>6&&!enemyAt(ex,ey)&&!(ex===boss.x&&ey===boss.y))
        enemies.push({x:ex,y:ey,vx:ex,vy:ey,dir:rnd(4),cd:Math.random()*0.4});
    }
  }

  function enemyAt(x,y){return enemies.some(function(e){return e.x===x&&e.y===y})}
  function bombAt(x,y){return bombs.some(function(b){return b.x===x&&b.y===y})}
  function free(x,y){return grid[y]&&grid[y][x]===0&&!bombAt(x,y)}
  function cnt(o){return bombs.filter(function(b){return b.o===o}).length}

  function hud(){
    var L=LV[level-1];
    $('hs').textContent=score;$('hl').textContent=level+'/'+MAXLV+(mode==='ninja'?' ⏱'+Math.floor(Math.max(0,timeLeft)/60)+':'+('0'+Math.floor(Math.max(0,timeLeft)%60)).slice(-2):'');var hs='';for(var hi=0;hi<Math.max(3,player.hp);hi++)hs+=hi<player.hp?'♥':'♡';$('he').textContent=hs;
    $('hb').textContent='炸彈'+player.maxB+' 火力'+player.range+' 速度'+(player.sp+1)+(player.sh?' 盾':'')+(hits?' 受傷'+hits:'');
    $('bn').textContent='魔王：'+L.n;
    var h='';for(var i=0;i<boss.max;i++)h+=i<boss.hp?'♥':'♡';
    $('bh').textContent=h;
    $('bs').textContent='炸彈'+boss.maxB+' 火力'+boss.range+' 速度'+(boss.sp+1)+(boss.sh?' 盾':'');
  }

  function placeBomb(){
    var bx=Math.round(player.vx),by=Math.round(player.vy);
    if(state!=='play'||player.stun>0||cnt('p')>=player.maxB||bombAt(bx,by))return;
    bombs.push({x:bx,y:by,t:2,range:player.range,o:'p'});
  }

  function explode0(b){
    bombs.splice(bombs.indexOf(b),1);
    flames.push({x:b.x,y:b.y,t:0.5,o:b.o});
    DIRS.forEach(function(d){
      for(var i=1;i<=b.range;i++){
        var x=b.x+d[0]*i,y=b.y+d[1]*i;
        if(grid[y][x]===1)break;
        flames.push({x:x,y:y,t:0.5,o:b.o});
        bombs.forEach(function(o){if(o.x===x&&o.y===y)o.t=0});
        items=items.filter(function(it){return !(it.x===x&&it.y===y)});
        if(grid[y][x]===2){
          grid[y][x]=0;if(b.o==='p')score+=10;
          if(Math.random()<0.4){items.push({x:x,y:y,k:rndItem()});}
          break;
        }
      }
    });
  }

  function danger(){
    var d={};
    bombs.forEach(function(b){
      d[K(b.x,b.y)]=1;
      DIRS.forEach(function(v){for(var i=1;i<=b.range;i++){
        var x=b.x+v[0]*i,y=b.y+v[1]*i;if(grid[y][x]===1)break;d[K(x,y)]=1;if(grid[y][x]===2)break;}});
    });
    flames.forEach(function(f){d[K(f.x,f.y)]=1});
    return d;
  }

  // BFS: returns first-step direction (-1 = already at goal, -2 = none)
  function bfs(sx,sy,goal,block,maxd){
    if(goal(sx,sy))return -1;
    var seen={},q=[[sx,sy,-3,0]];seen[K(sx,sy)]=1;
    for(var h=0;h<q.length;h++){
      var c=q[h];if(c[3]>=maxd)continue;
      for(var i=0;i<4;i++){
        var x=c[0]+DIRS[i][0],y=c[1]+DIRS[i][1];
        if(seen[K(x,y)]||grid[y][x]!==0||block(x,y))continue;
        seen[K(x,y)]=1;var f=c[2]===-3?i:c[2];
        if(goal(x,y))return f;
        q.push([x,y,f,c[3]+1]);
      }
    }
    return -2;
  }

  function bossBomb(b){
    b=b||boss;b.bcd=1.4;
    bombs.push({x:b.x,y:b.y,t:b.final?1.5:2,range:b.range+(b.final?1:0),o:b.o||'b',el:b.el});
  }

  function lineClear(ax,ay,bx,by){
    if(ax!==bx&&ay!==by)return false;
    var dx=Math.sign(bx-ax),dy=Math.sign(by-ay),x=ax,y=ay;
    while(x!==bx||y!==by){x+=dx;y+=dy;if(grid[y][x]!==0)return false}
    return true;
  }

  function bossThink(bb){
    var dg=danger(),b=bb||boss;
    var solid=function(x,y){return enemyAt(x,y)||false};
    var move=function(d){if(d>=0){var x=b.x+DIRS[d][0],y=b.y+DIRS[d][1];if(free(x,y)&&!solid(x,y)){b.x=x;b.y=y;}}};
    if(dg[K(b.x,b.y)]){
      move(bfs(b.x,b.y,function(x,y){return !dg[K(x,y)]},function(x,y){return !free(x,y)||solid(x,y)},12));return;
    }
    var safeBlock=function(x,y){return !free(x,y)||dg[K(x,y)]||solid(x,y)};
    // bomb decision
    if(b.bcd<=0&&cnt(b.o||'b')<b.maxB){
      var dist=Math.abs(player.x-b.x)+Math.abs(player.y-b.y);
      var atk=dist<=b.range&&lineClear(b.x,b.y,player.x,player.y);
      var soft=DIRS.some(function(d){return grid[b.y+d[1]][b.x+d[0]]===2});
      if(atk||(soft&&Math.random()<0.5)){
        bombs.push({x:b.x,y:b.y,t:2,range:b.range,o:'b'});
        var dg2=danger();
        var esc=bfs(b.x,b.y,function(x,y){return !dg2[K(x,y)]},function(x,y){return !free(x,y)||solid(x,y)},7);
        bombs.pop();
        if(esc>=0){bossBomb(b);move(esc);return}
      }
    }
    var s=bfs(b.x,b.y,function(x,y){return items.some(function(i){return i.x===x&&i.y===y})},safeBlock,10);
    if(s<0&&s!==-1){
      s=bfs(b.x,b.y,function(x,y){return Math.abs(x-player.x)+Math.abs(y-player.y)<=2},safeBlock,30);
      if(s===-2)s=bfs(b.x,b.y,function(x,y){return DIRS.some(function(d){return grid[y+d[1]][x+d[0]]===2})},safeBlock,30);
    }
    move(s);
  }

  function freeCell(minD,near){
    for(var i=0;i<200;i++){
      var x=1+rnd(W-2),y=1+rnd(H-2);
      if(!free(x,y)||enemyAt(x,y)||(x===player.x&&y===player.y)||(x===boss.x&&y===boss.y))continue;
      var dp=Math.abs(x-player.x)+Math.abs(y-player.y);
      if(near){if(Math.abs(x-boss.x)+Math.abs(y-boss.y)>4)continue}else if(dp<minD)continue;
      return [x,y];
    }
    return null;
  }

  function hurt(){
    if(player.inv>0||state!=='play')return;
    if(player.sh>0){player.sh--;player.inv=1.5;return}
    if(god){player.inv=1.2;hits++;return}
    player.hp--;hits++;player.inv=1.5;toast('受傷！剩餘生命 '+Math.max(0,player.hp),1.5);
    if(player.hp<=0)finish(false);
  }

  function pick(o,it){
    if(it.k==='M'){if(o===player)player.hp=Math.min(3,player.hp+1);return}
    if(it.k==='B')o.maxB=Math.min(o.maxB+1,o===player?6:4);
    else if(it.k==='R')o.range=Math.min(o.range+1,o===player?7:5);
    else if(it.k==='S')o.sp=Math.min(o.sp+1,5);
    else o.sh=1;
  }

  function finish(win){
    state=win?'win':'lose';
    var L=LV[level-1],N=LV[level];
    if(win){
      carry={score:score,b:1,r:2,s:0};if(mode==='ninja')recordClear();
      if(level<MAXLV){
        $('mt').textContent='擊敗 '+L.n+'！';
        $('mp').textContent='目前 '+score+' 分。下一關魔王：'+N.n+'。'+N.d;
        $('mb').textContent='下一關（Enter）';
      }else{
        $('mt').textContent='全破！';
        $('mp').textContent='你打倒了三位魔王，最終得分 '+score+'。';
        $('mb').textContent='重新開始（Enter）';
      }
    }else{
      $('mt').textContent='被打倒了';
      $('mp').textContent='第 '+level+' 關失敗。按 Enter 重打這一關（保留進入本關時的分數與能力）。';

  function update(dt){
    if(state!=='play')return;

    for(var g=0;g<4;g++){

      var ki=k?ORD.indexOf(k):-1;
      var fo=player.force;if(player.stun>0||player.root>0)ki=-1;else if(fo)ki=fo.d;
      if(ki<0&&!fo&&(player.vx!==player.x||player.vy!==player.y)&&Math.abs(player.vx-player.x)+Math.abs(player.vy-player.y)>0.6){
        var rx=player.x-DIRS[player.dir][0],ry=player.y-DIRS[player.dir][1];
        if(!bombAt(rx,ry)&&grid[ry][rx]===0){player.x=rx;player.y=ry;}
      }
      if((player.vx!==player.x||player.vy!==player.y)&&ki===(player.dir+2)%4){
        var ox=player.x-DIRS[player.dir][0],oy=player.y-DIRS[player.dir][1];
        if(!bombAt(ox,oy)){player.x=ox;player.y=oy;player.dir=ki;}
      }
      left=glide(player,left);
      if(player.vx!==player.x||player.vy!==player.y||ki<0)break;
      var d=DIRS[ki],nx=player.x+d[0],ny=player.y+d[1];
      if(free(nx,ny)){player.x=nx;player.y=ny;player.dir=ki;if(fo&&--fo.n<=0)player.force=null;}else{if(fo){player.force=null;if(fo.stun)player.stun=1;}break;}
      if(left<=0)break;
    }
    var pcx=Math.round(player.vx),pcy=Math.round(player.vy);
    // items for player & boss
    items=items.filter(function(it){
      if(it.x===pcx&&it.y===pcy&&(it.k!=='M'||player.hp<3)){pick(player,it);score+=20;return false}
      if(boss.hp>0&&it.k!=='M'&&it.x===boss.x&&it.y===boss.y){pick(boss,it);return false}
      if(beast&&it.k!=='M'&&it.x===beast.x&&it.y===beast.y){pick(beast,it);return false}
      return true;
    });
    // bombs & flames
    bombs.forEach(function(b){b.t-=dt});
    var due;while((due=bombs.filter(function(b){return b.t<=0})[0]))explode(due);
    flames.forEach(function(f){f.t-=dt});
    flames=flames.filter(function(f){return f.t>0});
    // boss
    boss.inv-=dt;boss.bcd-=dt;boss.cd-=dt;boss.fx-=dt;
    if(boss.cd<=0){boss.cd=Math.max(0.13,0.3-0.035*boss.sp);bossThink();}
    glide(boss,1.15/Math.max(0.13,0.3-0.035*boss.sp)*dt);
    if(mode==='ninja'){ninjaUpdate(dt);if(state!=='play')return;}
    if(mode==='trial'&&level===2){
      boss.tp-=dt;
      if(boss.tp<=0){boss.tp=7;
        var c=freeCell(4,false);
        if(c){boss.x=boss.vx=c[0];boss.y=boss.vy=c[1];boss.fx=0.5;}
      }
    }
    if(mode==='trial'&&level===3){
      boss.sum-=dt;boss.rain-=dt;

        for(var j=0;j<4;j++){var c3=freeCell(0,false);if(c3)bombs.push({x:c3[0],y:c3[1],t:1.6,range:2,o:'r'});}
      }
    }
    // enemies
    var spd=Math.max(0.2,0.42-level*0.05);
    enemies.forEach(function(e){
      glide(e,1.15/(e.spd||spd)*dt);e.cd-=dt;
      if(e.cd<=0){
        e.cd=e.spd||spd;
        var ok=function(x,y){return free(x,y)&&!enemyAt(x,y)&&!(x===boss.x&&y===boss.y)};
        var d=DIRS[e.dir];
        if(Math.random()<0.2||!ok(e.x+d[0],e.y+d[1])){
          var opts=[0,1,2,3].filter(function(i){return ok(e.x+DIRS[i][0],e.y+DIRS[i][1])});
          if(opts.length)e.dir=opts[rnd(opts.length)];
        }
        d=DIRS[e.dir];
        if(ok(e.x+d[0],e.y+d[1])){e.x+=d[0];e.y+=d[1];}
      }
    });
    // flame effects
    enemies=enemies.filter(function(e){
      var hit=flames.some(function(f){return f.x===Math.round(e.vx)&&f.y===Math.round(e.vy)});
      if(hit&&!e.clone)score+=100;return !hit;
    });
    if(boss.inv<=0&&flames.some(function(f){return f.x===Math.round(boss.vx)&&f.y===Math.round(boss.vy)})){
      if(boss.sh>0){boss.sh--;boss.inv=1.2;}
      else{if(hitBoss(flames.some(function(f){return f.o==='p'&&f.x===Math.round(boss.vx)&&f.y===Math.round(boss.vy)})))return;}
    }
    var near=function(o){return Math.abs(o.vx-player.vx)<0.7&&Math.abs(o.vy-player.vy)<0.7};
    if(flames.some(function(f){return f.x===pcx&&f.y===pcy})||enemies.some(function(e){return !e.clone&&near(e)}))hurt();
    hud();
  }

        if(b.final){if(!b.rev){b.t30=60;var e=EL[rnd(6)];if(beast&&e===beast.el)e=EL[(EL.indexOf(e)+1)%6];var bc=freeCell(0,true);if(bc){beast={x:bc[0],y:bc[1],vx:bc[0],vy:bc[1],el:e,hp:1,inv:0,cd:.5,bcd:2,maxB:1,range:3,sp:1,sh:0,o:'e'};b.fx=.6;toast('大魔王召喚了「'+ELN[EL.indexOf(e)]+'」召喚獸（每 60 秒更換一次）',3)}}}
        else skill(b.el)}
      if(b.final&&b.rev){b.bl-=dt;if(b.bl<=0){b.bl=20;
        for(var i=0;i<6;i++){var c=freeCell(0,true);if(c)bombs.push({x:c[0],y:c[1],t:1.6,range:2,o:'b'})}
        var d=freeCell(4,false);if(d){b.x=b.vx=d[0];b.y=b.vy=d[1];b.fx=.6}}}
    }
    // 體術：撿炸彈、投擲
    if(b.el==='taijutsu'){
      if(!b.hold){var o1=bombs.filter(function(o){return Math.abs(o.x-b.x)+Math.abs(o.y-b.y)<=1})[0];
        if(o1&&Math.random()<dt*3){bombs.splice(bombs.indexOf(o1),1);b.hold={t:.7,left:o1.t,range:o1.range}}}
      else{b.hold.t-=dt;if(b.hold.t<=0){var hd=b.hold,tc=tcell(pcx,pcy);b.hold=null;toss(b.x,b.y,tc[0],tc[1],function(){if(free(tc[0],tc[1]))bombs.push({x:tc[0],y:tc[1],t:Math.max(1.2,hd.left),range:hd.range,o:'b'})})}}
    }
    // 召喚獸
    if(beast){
      beast.inv-=dt;beast.bcd-=dt;beast.cd-=dt;
      if(beast.cd<=0){beast.cd=.4;bossThink(beast)}
      glide(beast,1.15/.4*dt);

    }

    enemies.forEach(function(e){if(e.clone){e.t-=dt;if(e.t<=0)e.dead=1}});
    enemies=enemies.filter(function(e){return !e.dead});
    ts.forEach(function(t){t.t-=dt;if(t.t<=0){t.fn();t.dead=1}});ts=ts.filter(function(t){return !t.dead});
    // 地面效果
    hz.forEach(function(h){h.t-=dt;if(h.ig>0)h.ig-=dt;
      if(h.k==='tor'){var v=DIRS[h.d];h.fx+=v[0]*2.5*dt;h.fy+=v[1]*2.5*dt;var tx=Math.round(h.fx),ty=Math.round(h.fy);if(grid[ty][tx]!==0)h.t=0;else{h.x=tx;h.y=ty}}});
    var gr=[];
    hz.forEach(function(h){if(h.k==='vine'){h.ext-=dt;if(h.ext<=0){h.ext=20;DIRS.forEach(function(d){gr.push([h.x+d[0],h.y+d[1]])})}}});
    gr.forEach(function(c){if(grid[c[1]][c[0]]===0&&!hz.some(function(h){return h.k==='vine'&&h.x===c[0]&&h.y===c[1]})&&hz.filter(function(h){return h.k==='vine'}).length<40)hz.push({x:c[0],y:c[1],k:'vine',t:999,ig:0,ext:20})});
    var due=[];
    hz=hz.filter(function(h){
      if(h.t<=0){if(h.fn)due.push(h);return false}
      if((h.k==='water'||h.k==='vine')&&!(h.ig>0)&&flames.some(function(f){return f.x===h.x&&f.y===h.y}))return false;
      return true});
    due.forEach(function(h){h.fn(h)});

      else if(h.k==='vine'&&!(player.root>0)){player.root=2;h.t=0}
    });
    // 電流與海嘯
    pj.forEach(function(p){
      var v=DIRS[p.d];p.x+=v[0]*p.sp*dt;p.y+=v[1]*p.sp*dt;
      var cx=Math.round(p.x),cy=Math.round(p.y);
      if(cx<0||cy<0||cx>W-1||cy>H-1||(!p.ghost&&grid[cy][cx]!==0)){p.dead=1;return}

    });

  }

    else if(el==='water'){ctx.moveTo(x,y-6);ctx.quadraticCurveTo(x+6,y+2,x,y+6);ctx.quadraticCurveTo(x-6,y+2,x,y-6)}
    else if(el==='sand'){ctx.moveTo(x-7,y+5);ctx.lineTo(x-2,y-5);ctx.lineTo(x+2,y);ctx.lineTo(x+5,y-3);ctx.lineTo(x+8,y+5)}

  }

    else if(a==='main')showMenu('main');else if(a==='lv')begin('ninja',+t.dataset.n);else if(a==='rnd')begin('ninja',1+rnd(unlockedN()));
  });
  menu.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='pname'){if(pickPlayer(e.target.value))showMenu('main')}});
  $('tomenu').onclick=function(){showMenu(who?'main':'who')};$('tomenu2').onclick=function(){showMenu(who?'main':'who')};

  function fit(){
    if(!document.querySelector)return;
    var de=document.documentElement,wr=document.querySelector('.wrap'),st=document.querySelector('.stage');
    mob=isMob();var land=mob&&window.innerWidth>window.innerHeight;
    de.classList.toggle('mob',mob);de.classList.toggle('land',land);
    if(!wr||!st)return;
    if(!mob){wr.style.width='';wr.style.height='';st.style.width='';st.style.height='';return}
    var iw=window.innerWidth,ih=window.innerHeight;
    wr.style.width=iw+'px';wr.style.height=ih+'px';
    var q=function(sel){var e=document.querySelector(sel);return e&&e.offsetParent!==null?e.offsetHeight+5:0};
    var used=12+30+q('.hud')+q('.tip')+q('.boss'),availH=ih-used-(land?0:140),availW=iw-12;
    var sc=Math.max(0.3,Math.min(availW/600,availH/520));
    st.style.width=Math.floor(600*sc)+'px';st.style.height=Math.floor(520*sc)+'px';
  }
  window.addEventListener('resize',fit);window.addEventListener('orientationchange',fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit);
  var joy=$('joy'),knob=$('knob'),jid=null;
  function jclear(){ORD.forEach(function(k){delete keys[k]});keys.__last=null}
  function jmove(e){
    var r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    var lx=dx,ly=dy,R=r.width/2,len=Math.hypot(lx,ly),sc=len>R?R/len:1;
    knob.style.transform='translate('+lx*sc+'px,'+ly*sc+'px)';
    jclear();
    if(len>R*0.25){var k=Math.abs(lx)>Math.abs(ly)?(lx>0?'ArrowRight':'ArrowLeft'):(ly>0?'ArrowDown':'ArrowUp');keys[k]=true;keys.__last=k}
  }
  joy.addEventListener('pointerdown',function(e){e.preventDefault();jid=e.pointerId;if(joy.setPointerCapture)joy.setPointerCapture(e.pointerId);jmove(e)});
  joy.addEventListener('pointermove',function(e){if(e.pointerId===jid)jmove(e)});
  var jend=function(e){if(e.pointerId===jid){jid=null;jclear();knob.style.transform='none'}};
  joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
  $('bombBtn').addEventListener('pointerdown',function(e){e.preventDefault();placeBomb()});
  if(document.addEventListener){
    document.addEventListener('touchmove',function(e){if(isMob()&&!(e.target&&e.target.closest&&e.target.closest('#menu,.tip')))e.preventDefault()},{passive:false});
    ['gesturestart','gesturechange'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()})});
  }
  window.__dbg={go:function(){state='play'},unlock:function(){who='T';SAVE.players.T={cl:35}},begin:begin,update:update,draw:draw,drawOver:drawOver,get:function(){return {ts:ts,player:player,boss:boss,hz:hz,pj:pj,enemies:enemies,state:state,bombs:bombs}}};

  function loop(now){
    var dt=Math.min(0.05,(now-last)/1000||0);last=now;
    if(state==='count'){cdT-=dt;if(cdT<=0){state='play';goT=.7}}else if(goT>0)goT-=dt;
    update(dt);draw(now);drawOver(now);
    requestAnimationFrame(loop);
  }

  function intro(){
    var L=LV[level-1];
    $('mt').textContent='第 '+level+' 關：'+L.n;
    $('mp').textContent=L.d+'小怪 '+L.en+' 隻，魔王生命 '+L.hp+'。';
  }

  function start(){
    if(state==='win'){
      if(level<MAXLV)level++;
      else{showMenu('main');return;}
    }else if(state==='menu'){level=1;carry={score:0,b:1,r:2,s:0};}
    init();hud();showReady();
  }

  window.addEventListener('keydown',function(e){
    if(e.target&&e.target.tagName==='INPUT')return;
    var k=e.key;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(k)>-1)e.preventDefault();
    if(k==='Enter'){if(state==='ready')startCount();else if(state==='win'||state==='lose')start();return}
    if(k===' '){if(!e.repeat)placeBomb();return}
    if(k.indexOf('Arrow')===0){keys[k]=true;keys.__last=k;}
  });
  window.addEventListener('keyup',function(e){
    delete keys[e.key];if(keys.__last===e.key)keys.__last=null;
  });
  window.addEventListener('blur',function(){keys={}});
  $('mb').onclick=function(){if(state==='ready')startCount();else if(state==='win'||state==='lose')start()};

  Array.prototype.forEach.call(document.querySelectorAll('#pad button'),function(b){
    var k=b.dataset.k;
    var on=function(e){e.preventDefault();if(k===' ')placeBomb();else{keys[k]=true;keys.__last=k;}};
    var off=function(e){e.preventDefault();delete keys[k];if(keys.__last===k)keys.__last=null;};
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);
    b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);
  });

  loadSave();if(SAVE.last&&SAVE.players[SAVE.last])who=SAVE.last;init();hud();fit();showMenu(who?'main':'who');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
